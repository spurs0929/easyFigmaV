[alembic]
script_location = alembic
prepend_sys_path = .

# NOTE: keep this file ASCII-only.
# Alembic reads it with the system locale encoding (cp950 on zh-TW Windows),
# not UTF-8, so non-ASCII comments break `alembic` on Windows.

# Timestamp prefix so versions/ sorts in apply order when listed.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Intentionally left unset: the connection URL comes from app.core.config via
# alembic/env.py, so SSL and pgbouncer handling lives in exactly one place and
# cannot drift from app/db/session.py.
# sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S