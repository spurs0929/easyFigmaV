name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'env.d.ts'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'eslint.config.ts'
      - '.oxlintrc.json'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'env.d.ts'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'eslint.config.ts'
      - '.oxlintrc.json'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm

      # 印出實際版本，方便在 log 中確認
      - run: node -v

      # --engine-strict：Node 版本不符合 package.json 的 engines（>=24.22.1 <25，
      # CVE-2026-111497 修補版）時直接失敗，不再只是警告。版本只維護在 engines 一處。
      - run: npm ci --engine-strict

      # 不帶 --fix：CI 只回報，不該在 runner 上偷偷改檔後判定通過
      - name: Lint
        run: npm run lint:ci

      # 不跑 npm run build：它用 run-p 平行跑 type-check 與 build-only，
      # 失敗時兩邊輸出交錯，拆成兩步才看得出是哪一段紅
      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:unit:ci

      - name: Build
        run: npm run build-only
